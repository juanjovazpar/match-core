[package]
name = "match_core"
version = "0.1.0"
edition = "2024"
authors = ["juanjo <https://github.com/juanjovazpar>"]

[dependencies]
dotenvy = "0.15" 
axum = "0.7"
tokio = { version = "1.41", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "5.5"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
bincode = "2.0.0"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
once_cell = "1.21.3"
exchain-commons = { git = "ssh://git@github.com/juanjovazpar/exchain-commons.git", branch = "master" }
# exchain-commons = { path = "../exchain-commons" }
tonic = "0.14.2"
