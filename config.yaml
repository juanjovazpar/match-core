shard:
  id: btc-usd
  pair_symbols: "BTC-USD"

grpc:
  port: 50051
  # Optional; defaults match the previous hard-coded values.
  # request_timeout_secs: 30
  # concurrency_limit_per_connection: 256
  # max_decoding_message_bytes: 4194304
  # max_encoding_message_bytes: 4194304
  # Max wait (ms) for a slot in the engine command queue; then RPC rejects (protects ingress latency).
  # command_enqueue_timeout_ms: 5000
  # Uncomment and point to PEM files to enable TLS (HTTP/2 over TLS).
  # tls:
  #   cert_path: "./certs/server.pem"
  #   key_path: "./certs/server.key"
  #   # Optional mTLS: PEM of the CA that signed **client** certs (clients must present a valid cert).
  #   client_ca_path: "./certs/ca.pem"
  #   # client_auth_optional: false

storage:
  data_dir: "./logs"
  log_file_segment_size: 128MB

snapshot:
  interval_seconds: 30
  max_commands: 10000

event_bus:
  type: nats
  url: "nats://localhost:4222"

engine:
  max_inflight_commands: 10000
  # Optional; default 65536. Tokio command queue capacity (ingress → engine).
  # command_channel_capacity: 65536

# Optional Prometheus scrape endpoint (`match_core_grpc_requests_total`, etc.).
# observability:
#   metrics_listen_addr: "0.0.0.0:9090"